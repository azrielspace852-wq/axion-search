# ============================================================
#  VPNX — outbound proxy container untuk AXION Search
#  Tujuannya: agar IP yang dilihat Google/Bing/Yahoo adalah IP
#  VPN (residential/datacenter VPN), BUKAN IP GitHub Actions —
#  sehingga mesin pencari tidak memblokir scraper.
#
#  Pakai image VPNX Anda sendiri lewat env VPNX_IMAGE, atau
#  default gluetun (multi-provider, built-in HTTP proxy :8888).
#  Server Node membaca HTTPS_PROXY=http://localhost:8888 dan
#  semua request axios keluar lewat CONNECT tunnel ini.
# ============================================================
services:
  vpnx:
    image: ${VPNX_IMAGE:-qmcgaw/gluetun:latest}
    container_name: axion-vpnx
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8888:8888/tcp"   # HTTP proxy (CONNECT) — dipakai server Node
    environment:
      # ── Credential VPN (simpan sebagai GitHub Secrets) ──
      - VPN_SERVICE_PROVIDER=${VPN_PROVIDER:-custom}
      - VPN_TYPE=${VPN_TYPE:-openvpn}
      - OPENVPN_USER=${VPN_USER:-}
      - OPENVPN_PASSWORD=${VPN_PASSWORD:-}
      - SERVER_COUNTRIES=${VPN_COUNTRIES:-Netherlands,Germany,Finland}
      # ── HTTP proxy (wajib aktif) ──
      - HTTPPROXY=on
      - HTTPPROXY_PORT=8888
      - HTTPPROXY_USER=${VPNX_PROXY_USER:-}
      - HTTPPROXY_PASSWORD=${VPNX_PROXY_PASS:-}
      - FIREWALL_OUTBOUND_SUBNETS=172.17.0.0/16,192.168.0.0/16,10.0.0.0/8
    volumes:
      - vpnx-data:/gluetun
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--timeout=5", "--tries=1", "-e", "use_proxy=yes", "-e", "http_proxy=http://127.0.0.1:8888", "https://api.ipify.org"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  vpnx-data:
