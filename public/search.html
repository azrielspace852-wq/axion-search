<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Search — AXION Search</title>
<meta name="robots" content="noindex, follow" />
<link rel="stylesheet" href="/css/style.css" />
<link rel="search" type="application/opensearchdescription+xml" title="AXION Search" href="/opensearch.xml" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9889;</text></svg>" />
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" data-menu-toggle aria-label="Open menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <a href="/" class="logo">AXION<span>Search</span></a>
    <form id="searchForm" class="search-form" autocomplete="off">
      <input id="query" type="text" name="q" data-i18n-ph="search_ph" placeholder="Search the web…" required />
      <button type="submit" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </form>
    <div class="top-actions">
      <select class="lang-select" data-lang-select aria-label="Language"></select>
      <button class="icon-btn" data-theme-toggle aria-label="Toggle theme" data-i18n-title="theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <a class="icon-btn" href="/settings" title="Settings" aria-label="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </a>
    </div>
  </header>
  <!-- Tabs: AI & All relocated to the FAR LEFT (point 13). Default active on submit = All. -->
  <nav class="tabs" id="tabs">
    <button class="tab ai-tab" data-type="ai" data-i18n="tab_ai">AI</button>
    <button class="tab active" data-type="all" data-i18n="tab_all">All</button>
    <button class="tab" data-type="web" data-i18n="tab_web">Web</button>
    <button class="tab" data-type="images" data-i18n="tab_images">Images</button>
    <button class="tab" data-type="videos" data-i18n="tab_videos">Videos</button>
    <button class="tab" data-type="news" data-i18n="tab_news">News</button>
    <button class="tab" data-type="audio" data-i18n="tab_audio">Audio</button>
    <button class="tab" data-type="apps" data-i18n="tab_apps">Apps</button>
    <button class="tab" data-type="shop" data-i18n="tab_shop">Shop</button>
  </nav>
  <main class="container">
    <section id="aiSummary" class="ai-summary hidden">
      <div class="ai-head">
        <span class="ai-badge">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          <span data-i18n="ai_summary">AI Summary</span>
        </span>
        <span style="display:flex; gap:8px; align-items:center;">
          <span class="ai-model" id="aiModelLabel"></span>
        </span>
      </div>
      <div id="aiBody" class="ai-body"></div>
    </section>
    <div id="status" class="status hidden"></div>
    <section id="results" class="results"></section>
    <section id="aiChat" class="ai-chat hidden">
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-row">
        <input id="chatInput" type="text" data-i18n-ph="ai_ask" placeholder="Ask follow-up…" />
        <button id="chatSend" data-i18n="send">Send</button>
      </div>
    </section>
    <div class="load-more" id="loadMore" style="display:none;">
      <button class="btn" id="loadMoreBtn" data-i18n="load_more">Load more</button>
    </div>
  </main>
  <footer class="footer">
    <div class="foot-links">
      <a href="/" data-i18n="home">Home</a>
      <a href="/privacy" data-i18n="privacy">Privacy</a>
      <a href="/safesearch" data-i18n="safesearch">SafeSearch</a>
      <a href="/settings" data-i18n="settings">Settings</a>
      <a href="/docs" data-i18n="docs">Docs</a>
      <a href="/sdk" data-i18n="sdk">SDK</a>
      <a href="https://axion-hub.axn.cc.cd/donate" target="_blank" rel="noopener" data-i18n="donate">Donate</a>
    </div>
    <div>AXION Search v5 · Cloudflare Pages + Workers</div>
  </footer>
  <script src="/js/i18n.js"></script>
  <script src="/js/db.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/search.js"></script>
</body>
</html>
