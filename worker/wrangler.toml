# ============================================================
#  AXION Search v5 — Cloudflare Worker (Backend API)
#  Deploy:  cd worker && npx wrangler deploy
#  Domain:  api.search.axn.cc.cd
#
#  Secrets (set via Cloudflare Dashboard → Workers & Pages →
#  Settings → Variables, or `npx wrangler secret put <NAME>`):
#     BRAVE_API_KEY, SERPDIVE_API_KEY, TAVILY_API_KEY,
#     AI_KEY_1, AI_KEY_2, AI_KEY_3
#  (Migrated from GitHub Secrets — point 11 of the migration.)
# ============================================================
name = "axion-search-api"
main = "src/index.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "api.search.axn.cc.cd/*", zone_name = "axn.cc.cd" }
]

# KV namespace — Tier 1 edge cache (longer TTL than Cache API)
# Create with: npx wrangler kv namespace create AXION_KV
kv_namespaces = [
  { binding = "AXION_KV", id = "e1cfe313fd794f3e8147f8daa98c3e88" }
]

# Non-secret variables (secrets live in Dashboard, NOT in this file)
[vars]
SAFESEARCH_DEFAULT = "1"
